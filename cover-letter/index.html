<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tristan Douville — Cover Letter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #1a6bd6;
      --blue-dark: #1558b0; /* WCAG AA fix — was: inline #1558b0 on .btn-submit:hover */
      --blue-light: #e8f0fc;
      --blue-mid: #c5d8f8;
      --dark: #111827;
      --mid: #374151;
      --muted: #6b7280;
      --muted-on-dark: #9ca3af; /* WCAG AA fix — was: #6b7280 placeholder / #4b5563 footer */
      --border: #e5e9f0;
      --bg: #f7f9fc;
      --white: #ffffff;
      --radius: 14px;
      --radius-sm: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #e5e7eb;
      color: var(--dark);
      font-size: 10.5px;
      line-height: 1.42;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    a {
      color: var(--blue-dark); /* WCAG AA fix — was: var(--blue) */
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .page {
      width: 8.5in;
      height: 11in;
      overflow: hidden;
      background: var(--white);
      margin: 24px auto;
      padding: 0.34in 0.4in 0;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      position: relative;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--blue);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ── HEADER ── */
    .resume-header {
      margin-bottom: 0.14in;
      padding-top: 0.04in;
      padding-bottom: 0.12in;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header-name {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      font-weight: 400;
      color: var(--dark);
      line-height: 1.1;
      letter-spacing: -0.3px;
    }

    .title-badge {
      display: inline-block;
      background: var(--blue);
      color: #fff;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 3px 11px;
      border-radius: 99px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .header-contact {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 14px;
      margin-top: 12px;
      font-style: normal;
    }

    .contact-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      line-height: 1.2;
      white-space: nowrap;
      color: var(--blue-dark); /* WCAG AA fix — was: var(--blue) */
    }

    .contact-item svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    /* ── LETTER BODY ── */
    .letter-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .letter-content {
      margin-top: auto;
      margin-bottom: auto;
      font-size: 10.5px;
      line-height: 1.5;
      color: var(--mid);
    }

    .letter-content p + p {
      margin-top: 0.12in;
    }

    .letter-content .signature-spacer {
      margin: 0;
      min-height: 2.5em;
    }

    /* ── FOOTER ── */
    .resume-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding: 0.28in 0;
      margin-top: auto;
      font-size: 10px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      flex-shrink: 0;
    }

    .footer-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      line-height: 1.2;
      color: var(--muted);
    }

    .footer-item svg {
      flex-shrink: 0;
    }

    .footer-item svg:not(.flag-icon) {
      width: 12px;
      height: 12px;
    }

    .footer-item .flag-icon {
      width: 12px;
      height: 12px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ── PRINT ── */
    @page {
      size: letter;
      margin: 0;
    }

    @media print {
      body {
        background: white;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .page {
        width: 8.5in;
        height: 11in;
        overflow: hidden;
        margin: 0;
        box-shadow: none;
        display: flex;
        flex-direction: column;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .title-badge,
      .page::before,
      .footer-item .flag-icon {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>

  <script>
    (function () {
      var letterBody = document.querySelector('.letter-body');
      var letterContent = document.getElementById('letter-content');

      COVER_LETTER.split(/\n\n+/)
        .map(function (block) { return block.trim(); })
        .filter(Boolean)
        .forEach(function (block) {
          if (block === '---') {
            var spacer = document.createElement('p');
            spacer.className = 'signature-spacer';
            spacer.setAttribute('aria-hidden', 'true');
            letterContent.appendChild(spacer);
            return;
          }
          var p = document.createElement('p');
          block.split('\n').forEach(function (line, idx) {
            if (idx > 0) p.appendChild(document.createElement('br'));
            p.appendChild(document.createTextNode(line));
          });
          letterContent.appendChild(p);
        });

      function fitLetterContent() {
        var minSize = 9;
        var maxSize = 15;
        var step = 0.5;
        var bestSize = minSize;
        var bestLh = 1.4;

        for (var fs = minSize; fs <= maxSize; fs += step) {
          var lh = 1.4 + (fs - minSize) * 0.04;
          letterContent.style.fontSize = fs + 'px';
          letterContent.style.lineHeight = String(Math.round(lh * 100) / 100);
          if (letterContent.scrollHeight <= letterBody.clientHeight) {
            bestSize = fs;
            bestLh = lh;
          } else {
            break;
          }
        }

        letterContent.style.fontSize = bestSize + 'px';
        letterContent.style.lineHeight = String(Math.round(bestLh * 100) / 100);
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(fitLetterContent);
      } else {
        fitLetterContent();
      }
    })();
  </script>
