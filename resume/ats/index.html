<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tristan Douville — Resume (ATS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #1a6bd6;
      --blue-dark: #1558b0; /* WCAG AA fix — was: inline #1558b0 on .btn-submit:hover */
      --blue-light: #e8f0fc;
      --blue-mid: #c5d8f8;
      --dark: #111827;
      --mid: #374151;
      --muted: #6b7280;
      --border: #e5e9f0;
      --white: #ffffff;
      --radius: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #e5e7eb;
      color: var(--dark);
      font-size: 10px;
      line-height: 1.32;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    a {
      color: var(--blue-dark); /* WCAG AA fix — was: var(--blue) */
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .page-ats {
      width: 8.5in;
      max-width: 8.5in;
      margin: 24px auto;
      padding: 0.6in;
      background: var(--white);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      position: relative;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page-ats::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--blue);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ── HEADER ── */
    .resume-header {
      margin-bottom: 0.13in;
      padding-bottom: 0.09in;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header-name {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      font-weight: 400;
      color: var(--dark);
      line-height: 1.1;
      letter-spacing: -0.3px;
    }

    .title-badge {
      display: inline-block;
      background: var(--blue);
      color: #fff;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 3px 11px;
      border-radius: 99px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .header-bio {
      margin-top: 6px;
      font-size: 10px;
      color: var(--mid);
      line-height: 1.32;
    }

    .header-contact {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 3px 10px;
      margin-top: 8px;
      font-style: normal;
    }

    .contact-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 9px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .contact-item svg {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
    }

    /* ── SECTIONS ── */
    .section {
      margin-bottom: 0.12in;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue);
      padding-bottom: 3px;
      margin-bottom: 5px;
      border-bottom: 1px solid var(--blue-mid);
    }

    .section-title svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    /* ── WORK ENTRIES (selected work, experience, skills, education, volunteering) ── */
    .exp-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--dark);
      line-height: 1.3;
      margin-bottom: 1px;
    }

    .exp-title strong {
      font-weight: 700;
    }

    .exp-date {
      font-size: 9.5px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .work-body,
    .exp-bullet,
    .skill-line {
      font-size: 10px;
      color: var(--mid);
      line-height: 1.32;
      margin-bottom: 2px;
    }

    .work-body {
      margin-top: 1px;
    }

    .skill-line {
      margin-bottom: 4px;
    }

    .skill-line:last-child {
      margin-bottom: 0;
    }

    .skill-line strong {
      font-weight: 700;
      color: var(--dark);
    }

    .work-body:last-child,
    .exp-bullet:last-child {
      margin-bottom: 0;
    }

    .exp-bullet {
      padding-left: 10px;
      text-indent: -10px;
    }

    .exp-bullet::before {
      content: '• ';
      color: var(--blue);
    }

    .work-body strong,
    .exp-bullet strong {
      font-weight: 700;
      color: var(--dark);
    }

    .work-card {
      border-left: 3px solid var(--blue-mid);
      padding-left: 10px;
      margin-bottom: 11px;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .work-card:last-child {
      margin-bottom: 0;
    }

    .section-selected-work .exp-title,
    .section-experience .exp-title {
      font-size: 11px;
    }

    .section-selected-work .work-body,
    .section-experience .work-body,
    .section-experience .exp-bullet {
      font-size: 9.5px;
    }

    .section-experience .exp-date {
      font-size: 9px;
    }

    .exp-entry,
    .edu-entry,
    .volunteer-entry,
    .skills-block {
      page-break-inside: avoid;
      break-inside: avoid;
    }

    /* ── FOOTER ── */
    .resume-footer {
      display: block;
      padding-top: 0.13in;
      margin-top: 0.06in;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .footer-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      line-height: 1.32;
      color: var(--muted);
      margin-right: 14px;
    }

    .footer-item svg {
      flex-shrink: 0;
    }

    .footer-item svg:not(.flag-icon) {
      width: 12px;
      height: 12px;
    }

    .footer-item .flag-icon {
      width: 12px;
      height: 12px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ── PRINT ── */
    @page {
      size: letter;
      margin: 0.6in;
    }

    @media print {
      body {
        background: white;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .page-ats {
        width: auto;
        max-width: none;
        margin: 0;
        padding: 0;
        box-shadow: none;
      }

      .page-ats::before {
        content: none;
      }

      .title-badge,
      .work-card,
      .exp-entry,
      .edu-entry,
      .volunteer-entry,
      .skills-block,
      .footer-item .flag-icon {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <noscript>
    <p style="margin: 1rem; padding: 1rem; font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.5; background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;">This resume requires JavaScript to display. Edit content in <code>resume/resume-data.js</code>, or open a PDF you previously exported.</p>
  </noscript>
  <div class="page-ats">
    <header class="resume-header">
      <div class="header-top">
        <h1 class="header-name" id="header-name"></h1>
        <span class="title-badge" id="header-title-badge"></span>
      </div>
      <p class="header-bio" id="header-bio"></p>
      <address class="header-contact" id="contact-list"></address>
    </header>

    <main>
      <section class="section section-selected-work">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
          Selected Work
        </h2>
        <div id="selected-work-list"></div>
      </section>

      <section class="section section-experience">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
          Product Experience
        </h2>
        <div id="experience-list"></div>
      </section>

      <section class="section">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Skills &amp; Tools
        </h2>
        <div id="skills-groups"></div>
      </section>

      <section class="section">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          Education &amp; Certifications
        </h2>
        <div id="education-list"></div>
      </section>

      <section class="section">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          Volunteering
        </h2>
        <div id="volunteering-list"></div>
      </section>
    </main>

    <footer class="resume-footer">
      <a class="footer-item" id="footer-website" href="">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="footer-website-label"></span>
      </a>
      <span class="footer-item">
        <svg class="flag-icon" viewBox="-2015 -2000 4030 4030" aria-hidden="true"><path fill="#d52b1e" d="m-90 2030 45-863a95 95 0 0 0-111-98l-859 151 116-320a65 65 0 0 0-20-73l-941-762 212-99a65 65 0 0 0 34-79l-186-572 542 115a65 65 0 0 0 73-38l105-247 423 454a65 65 0 0 0 111-57l-204-1052 327 189a65 65 0 0 0 91-27l332-652 332 652a65 65 0 0 0 91 27l327-189-204 1052a65 65 0 0 0 111 57l423-454 105 247a65 65 0 0 0 73 38l542-115-186 572a65 65 0 0 0 34 79l212 99-941 762a65 65 0 0 0-20 73l116 320-859-151a95 95 0 0 0-111 98l45 863z"/></svg>
        <span id="footer-location-text"></span>
      </span>
    </footer>
  </div>

  <script src="../resume-data.js"></script>
  <script src="../resume-shared.js"></script>
  <script src="render-ats.js"></script>
</body>
</html>
